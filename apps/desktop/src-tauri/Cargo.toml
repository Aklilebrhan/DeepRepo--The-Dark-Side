[package]
name = "deeprepo-desktop"
version = "0.1.0"
description = "DeepRepo – The Dark Side: Local Codebase RAG & Semantic Explorer"
authors = ["DeepRepo Team"]
license = "MIT"
repository = "https://github.com/deeprepo/deeprepo"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "fs-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
