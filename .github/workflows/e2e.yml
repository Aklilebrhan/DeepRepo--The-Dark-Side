name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Playwright Browsers
        run: pnpm --filter @deeprepo/e2e exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm test:e2e
